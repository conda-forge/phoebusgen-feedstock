{% set name = "phoebusgen" %}
{% set version = "3.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/phoebusgen-{{ version }}.tar.gz
  sha256: d98c7363b939c18954b6cfd334e80bd1a62b356ae33ad32ec5dfd8706e077cf7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - phoebusgen
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/als-epics/phoebusgen
  summary: Screen generator for CS-Studio Phoebus displays
  license: GPL-2.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jwlodek
